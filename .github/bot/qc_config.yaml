# MetaRepo QC Bot Configuration
# Customize the checklist items shown to PRs

checklist_items:
  - "Have you edited the README with clear instructions on how to reproduce your results?"
  - "Have you uploaded all the materials needed to reproduce your results?"
  - "Have you added a DOI to your metarepo?"
  - "Have you added your metarepo citation to your paper?"
  - "Have you double-checked all author names?"
  - "Does the journal name in your repo exactly match the name in your accepted publication?"
  - "Have you included code references and version numbers for all software used?"

# AI Configuration
ai:
  model: "gpt-4o-mini"
  temperature: 0.7
  max_tokens: 800
